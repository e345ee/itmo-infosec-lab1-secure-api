name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.9.4
      - run: mkdir -p reports
      - run: bandit -r app.py -f json -o reports/bandit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: mkdir -p reports
      - run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: reports/pip-audit.json

  owasp_dependency_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: secure-lab-api
          path: requirements.txt
          format: HTML
          out: reports/owasp
          args: >-
            --failOnCVSS 7
            --enableExperimental
            --disableOssIndex
            --suppression dependency-check-suppressions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/owasp
